<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#060b0a">
  <title>Admin RAW RP</title>
  <link rel="icon" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ================= Connexion (écrans remplis par admin.js) ================= -->
  <section class="login" id="login">
    <form class="login-card" id="loginCard" autocomplete="off"></form>
  </section>

  <!-- ================= Éditeur ================= -->
  <div class="app" id="app" hidden>
    <header class="top">
      <div class="logo"><img src="images/logo.png" alt="RAW RP"> <small>ADMIN</small></div>
      <span class="pill" id="state">À jour</span>
      <div class="top-actions">
        <button class="ic" id="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
        <button class="ic" id="redo" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir">↷</button>
        <div class="menu-wrap">
          <button class="ic" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-label="Plus d'options">⋯</button>
          <div class="dropdown" id="more" hidden>
            <a href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
            <a id="histLink" href="#" target="_blank" rel="noopener">Historique des versions (GitHub) ↗</a>
            <button id="discard">Annuler les modifications non publiées</button>
            <button id="exportBtn">Exporter une sauvegarde (.json)</button>
            <label class="as-btn">Importer une sauvegarde<input type="file" id="importFile" accept="application/json,.json" hidden></label>
            <button id="downloadBtn">Télécharger content.js (sauvegarde)</button>
            <button id="resetBtn">Revenir au contenu d'origine</button>
            <button id="changePw" class="sep">Changer le mot de passe</button>
            <button id="changePhrase">Changer la phrase secrète</button>
            <button id="changeToken">Remplacer le jeton GitHub</button>
            <button id="logout" class="danger">Se déconnecter</button>
          </div>
        </div>
        <button class="btn" id="logoutTop" title="Se déconnecter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg><span>Déconnexion</span></button>
        <button class="btn primary" id="publish">Publier</button>
      </div>
    </header>

    <div class="folder" id="repoBar"></div>

    <div class="banner" id="draftBanner" hidden>
      Un brouillon non publié a été retrouvé sur cet appareil.
      <button class="btn small primary" id="draftResume">Le reprendre</button>
      <button class="btn small" id="draftDrop">L'ignorer</button>
    </div>

    <div class="views" role="tablist" aria-label="Affichage">
      <button role="tab" class="on" data-view="edit" aria-selected="true">Modifier</button>
      <button role="tab" data-view="preview" aria-selected="false">Aperçu</button>
    </div>

    <div class="work" id="work" data-view="edit">
      <nav class="tabs" id="tabs" aria-label="Parties du site"></nav>
      <main class="editor" id="editor"></main>
      <section class="preview">
        <div class="pv-bar">
          <span>Aperçu en direct</span>
          <div class="seg">
            <button class="on" data-dev="desk">Ordinateur</button>
            <button data-dev="mob">Mobile</button>
          </div>
        </div>
        <div class="pv-frame" id="pvFrame"><iframe id="pv" src="index.html?apercu=1" title="Aperçu du site"></iframe></div>
      </section>
    </div>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="depot.js"></script>
  <script src="defaults.js"></script>
  <script src="content.js"></script>
  <script src="admin.js"></script>
</body>
</html>
